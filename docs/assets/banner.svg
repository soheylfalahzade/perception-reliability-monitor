<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-label="perception-reliability-monitor">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1017"/><stop offset="1" stop-color="#14263a"/></linearGradient></defs>
<style>.t{font:600 30px Georgia,serif;fill:#fff}.q{font:400 17px Georgia,serif;fill:#6fa8d6}.d{font:400 13px -apple-system,Segoe UI,sans-serif;fill:#9fb3c4}.n{font:600 24px Georgia,serif;fill:#ffb454}.l{font:600 12px -apple-system,Segoe UI,sans-serif;fill:#e6eef5}.s{font:400 11px -apple-system,Segoe UI,sans-serif;fill:#7f95a8}</style>
<rect width="860" height="290" rx="16" fill="url(#g)"/><circle cx="800" cy="40" r="90" fill="#6fa8d6" opacity=".08"/>
<text x="40" y="58" class="t">perception-reliability-monitor</text><text x="40" y="92" class="q">Can a camera tell when it cannot be trusted?</text>
<foreignObject x="40" y="108" width="780" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:13px sans-serif;color:#9fb3c4">Ground-truth-free reliability scoring and graceful degradation for camera-based traffic perception</div></foreignObject>
<g transform="translate(40,176)"><rect width="250" height="86" rx="12" fill="#0f1b26" stroke="#22323f"/><rect width="250" height="3" rx="1.5" fill="#6fa8d6"/><text x="16" y="38" class="n">0.938</text><text x="16" y="58" class="l">reliability AUC</text><text x="16" y="74" class="s">image quality alone: 0.873</text></g><g transform="translate(310,176)"><rect width="250" height="86" rx="12" fill="#0f1b26" stroke="#22323f"/><rect width="250" height="3" rx="1.5" fill="#6fa8d6"/><text x="16" y="38" class="n">3–8 s</text><text x="16" y="58" class="l">alarm latency</text><text x="16" y="74" class="s">after a real detector failure</text></g><g transform="translate(580,176)"><rect width="250" height="86" rx="12" fill="#0f1b26" stroke="#22323f"/><rect width="250" height="3" rx="1.5" fill="#6fa8d6"/><text x="16" y="38" class="n">0.049</text><text x="16" y="58" class="l">calibration error</text><text x="16" y="74" class="s">ECE, held-out seeds</text></g></svg>